[project]
name = "agent-workflow-foundation"
version = "0.1.0"
description = "Environment-agnostic agent workflow CLI for specs, tickets, BDD contracts, and hygiene."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12.0",
  "pydantic-ai[dbos]>=1.104.0",
  "pydantic-evals>=1.104.0",
  "rich>=14.0.0",
  "typer>=0.20.0",
]

[project.scripts]
awf = "agent_workflow.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["tools/agent-workflow/src/agent_workflow"]
